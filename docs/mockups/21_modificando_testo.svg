<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" width="460" height="420" role="img" aria-label="Modifica del testo - con selezione">
<title>pastepad testo nuovo con selezione attiva</title>
<desc>L'area di testo del dialogo con una porzione di testo evidenziata (il cursore sta scrivendo), e il cursore lampeggiante alla fine della selezione.</desc>

<rect x="0" y="0" width="460" height="420" rx="20" fill="#141417" stroke="#242429" stroke-width="1"/>
<text x="24" y="40" font-family="Segoe UI" font-size="16" font-weight="500" fill="#F4F4F5" text-anchor="start">Nuovo testo</text>
<text x="24" y="74" font-family="Segoe UI" font-size="11" font-weight="400" fill="#9C9CA6" text-anchor="start">Salva in</text>
<rect x="100" y="58" width="120" height="28" rx="10" fill="#1B1B1F" />
<text x="112" y="76" font-family="Segoe UI" font-size="11" font-weight="400" fill="#F4F4F5" text-anchor="start">I miei testi</text>
<text x="210" y="76" font-family="Segoe UI" font-size="11" font-weight="400" fill="#9C9CA6" text-anchor="start">▾</text>
<rect x="24" y="98" width="412" height="220" rx="12" fill="#1B1B1F" stroke="#2DD4A7" stroke-width="1.5"/>
<text x="38" y="124" font-family="Segoe UI" font-size="12" font-weight="400" fill="#F4F4F5" text-anchor="start">Ciao [[nome]], ti scrivo riguardo a</text>
<rect x="38" y="132" width="58" height="16" rx="3" fill="#2DD4A7" />
<text x="40" y="144" font-family="Segoe UI" font-size="12" font-weight="400" fill="#052E23" text-anchor="start">[[tema]]</text>
<text x="100" y="144" font-family="Segoe UI" font-size="12" font-weight="400" fill="#F4F4F5" text-anchor="start"> del giorno</text>
<line x1="182" y1="132" x2="182" y2="148" stroke="#2DD4A7" stroke-width="1.5"/>
<text x="24" y="340" font-family="Segoe UI" font-size="10" font-weight="400" fill="#6B6B75" text-anchor="start">Scrivi [[qualcosa]] e il programma te lo</text>
<text x="24" y="354" font-family="Segoe UI" font-size="10" font-weight="400" fill="#6B6B75" text-anchor="start">chiederà prima di incollare</text>
<rect x="24" y="376" width="90" height="32" rx="10" fill="#1B1B1F" />
<text x="69" y="397" font-family="Segoe UI" font-size="11" font-weight="400" fill="#F4F4F5" text-anchor="middle">Annulla</text>
<rect x="342" y="376" width="94" height="32" rx="10" fill="#2DD4A7" />
<text x="389" y="397" font-family="Segoe UI" font-size="12" font-weight="500" fill="#052E23" text-anchor="middle">Salva</text>
</svg>