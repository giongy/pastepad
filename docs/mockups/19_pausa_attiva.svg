<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="380" height="220" role="img" aria-label="Intestazione con pausa attiva">
<title>pastepad cattura in pausa</title>
<desc>Solo l'intestazione: l'avviso rosso 'In pausa' a sinistra e l'icona cambiata in play in rosso, a destra.</desc>

<rect x="0" y="0" width="380" height="220" rx="20" fill="#0B0B0D" stroke="#242429" stroke-width="1"/>
<text x="16" y="26" font-family="Segoe UI" font-size="11" font-weight="400" fill="#6B6B75" text-anchor="start">Ctrl + Shift + V</text>
<text x="150" y="26" font-family="Segoe UI" font-size="11" font-weight="500" fill="#EF4444" text-anchor="start">● In pausa</text>
<circle cx="300" cy="20" r="10" fill="#1B1B1F" stroke="#EF4444" stroke-width="1"/>
<text x="300" y="24" font-family="Segoe UI" font-size="9" font-weight="400" fill="#EF4444" text-anchor="middle">▶</text>
<circle cx="330" cy="20" r="10" fill="#1B1B1F" />
<text x="330" y="24" font-family="Segoe UI" font-size="9" font-weight="400" fill="#9C9CA6" text-anchor="middle">@</text>
<circle cx="360" cy="20" r="10" fill="#1B1B1F" />
<text x="360" y="24" font-family="Segoe UI" font-size="9" font-weight="400" fill="#9C9CA6" text-anchor="middle">x</text>
<rect x="16" y="50" width="348" height="42" rx="12" fill="#141417" />
<text x="32" y="76" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6B6B75" text-anchor="start">◎  Cerca ovunque</text>
<text x="16" y="150" font-family="Segoe UI" font-size="11" font-weight="400" fill="#6B6B75" text-anchor="start">Finché è in pausa, il sorvegliante degli</text>
<text x="16" y="166" font-family="Segoe UI" font-size="11" font-weight="400" fill="#6B6B75" text-anchor="start">appunti non annota niente di nuovo. Il pulsante</text>
<text x="16" y="182" font-family="Segoe UI" font-size="11" font-weight="400" fill="#6B6B75" text-anchor="start">passa da icona di pausa a icona di play, in rosso.</text>
</svg>