<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="380" height="220" role="img" aria-label="Flusso 4 di 5 - un clic">
<title>l'utente fa clic sulla riga del link</title>
<desc>La riga del link con un indicatore di clic (cerchio pulsante) che mostra il momento del clic.</desc>

<rect x="0" y="0" width="380" height="220" rx="20" fill="#0B0B0D" stroke="#242429" stroke-width="1"/>
<text x="16" y="30" font-family="Segoe UI" font-size="12" font-weight="500" fill="#F4F4F5" text-anchor="start">4. Un clic sulla riga</text>
<rect x="16" y="50" width="348" height="56" rx="14" fill="#2DD4A7" />
<text x="30" y="72" font-family="Segoe UI" font-size="12.5" font-weight="500" fill="#052E23" text-anchor="start">🔗 https://docs.python.org/3...</text>
<text x="30" y="90" font-family="Segoe UI" font-size="10" font-weight="400" fill="#052E23" text-anchor="start">docs.python.org</text>
<circle cx="320" cy="78" r="10" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
<circle cx="320" cy="78" r="16" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
<text x="16" y="150" font-family="Segoe UI" font-size="11" font-weight="400" fill="#6B6B75" text-anchor="start">Poiché il testo È un link completo,</text>
<text x="16" y="166" font-family="Segoe UI" font-size="11" font-weight="400" fill="#6B6B75" text-anchor="start">il clic non lo incolla: lo apre direttamente</text>
<text x="16" y="182" font-family="Segoe UI" font-size="11" font-weight="400" fill="#6B6B75" text-anchor="start">nel browser.</text>
</svg>