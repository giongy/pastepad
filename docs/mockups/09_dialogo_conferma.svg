<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180" role="img" aria-label="Dialogo - Conferma">
<title>pastepad dialogo conferma</title>
<desc>Messaggio di avvertimento, Annulla e Sì-elimina in rosso.</desc>

<rect x="0" y="0" width="360" height="180" rx="20" fill="#141417" stroke="#242429" stroke-width="1"/>
<text x="24" y="38" font-family="Segoe UI" font-size="15" font-weight="500" fill="#F4F4F5" text-anchor="start">Conferma</text>
<text x="24" y="68" font-family="Segoe UI" font-size="12" font-weight="400" fill="#F4F4F5" text-anchor="start">Eliminare la cartella Lavoro e i suoi</text>
<text x="24" y="86" font-family="Segoe UI" font-size="12" font-weight="400" fill="#F4F4F5" text-anchor="start">6 testi? Non si può</text>
<text x="24" y="104" font-family="Segoe UI" font-size="12" font-weight="400" fill="#F4F4F5" text-anchor="start">annullare.</text>
<rect x="24" y="130" width="90" height="32" rx="10" fill="#1B1B1F" />
<text x="69" y="151" font-family="Segoe UI" font-size="11" font-weight="400" fill="#F4F4F5" text-anchor="middle">Annulla</text>
<rect x="236" y="130" width="100" height="32" rx="10" fill="#DC2626" />
<text x="286" y="151" font-family="Segoe UI" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle">Sì, elimina</text>
</svg>