<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="380" height="220" role="img" aria-label="Errore - salvataggio fallito">
<title>pastepad avviso di errore di salvataggio</title>
<desc>Avviso in rosso che indica che non è stato possibile scrivere il file, con un pulsante per vedere il registro degli errori.</desc>

<rect x="0" y="0" width="380" height="220" rx="20" fill="#141417" stroke="#EF4444" stroke-width="1.5"/>
<circle cx="40" cy="42" r="15" fill="#3A1414" />
<text x="40" y="48" font-family="Segoe UI" font-size="16" font-weight="700" fill="#EF4444" text-anchor="middle">!</text>
<text x="66" y="38" font-family="Segoe UI" font-size="14" font-weight="500" fill="#F4F4F5" text-anchor="start">Impossibile salvare</text>
<text x="24" y="80" font-family="Segoe UI" font-size="11" font-weight="400" fill="#9C9CA6" text-anchor="start">Non è stato possibile scrivere il file</text>
<text x="24" y="96" font-family="Segoe UI" font-size="11" font-weight="400" fill="#9C9CA6" text-anchor="start">snippets.json. Forse la cartella è in</text>
<text x="24" y="112" font-family="Segoe UI" font-size="11" font-weight="400" fill="#9C9CA6" text-anchor="start">sola lettura, o un altro programma lo</text>
<text x="24" y="128" font-family="Segoe UI" font-size="11" font-weight="400" fill="#9C9CA6" text-anchor="start">ha aperto in questo momento.</text>
<rect x="24" y="164" width="140" height="32" rx="10" fill="#1B1B1F" />
<text x="94" y="185" font-family="Segoe UI" font-size="10.5" font-weight="400" fill="#F4F4F5" text-anchor="middle">Vedi errori.log</text>
<rect x="282" y="164" width="74" height="32" rx="10" fill="#2DD4A7" />
<text x="319" y="185" font-family="Segoe UI" font-size="11" font-weight="500" fill="#052E23" text-anchor="middle">Chiudi</text>
</svg>