<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220" role="img" aria-label="Flusso 1 di 5 - copiare il link">
<title>l'utente seleziona e copia una URL nel browser</title>
<desc>Una barra degli indirizzi generica con la URL selezionata, a simulare il momento di Ctrl+C.</desc>

<rect x="0" y="0" width="460" height="220" rx="14" fill="#F2F2F0" />
<rect x="16" y="16" width="428" height="32" rx="8" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>
<rect x="30" y="24" width="300" height="16" rx="4" fill="#D8EFE8" />
<text x="36" y="36" font-family="Segoe UI" font-size="11" font-weight="400" fill="#141416" text-anchor="start">https://docs.python.org/3/library/os.html</text>
<text x="16" y="80" font-family="Segoe UI" font-size="13" font-weight="500" fill="#333" text-anchor="start">1. Seleziona l'indirizzo nella barra</text>
<text x="16" y="100" font-family="Segoe UI" font-size="13" font-weight="400" fill="#333" text-anchor="start">   e premi Ctrl+C</text>
<rect x="16" y="130" width="428" height="60" rx="10" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>
<text x="30" y="155" font-family="Segoe UI" font-size="11" font-weight="400" fill="#666" text-anchor="start">pastepad rileva il cambio negli</text>
<text x="30" y="172" font-family="Segoe UI" font-size="11" font-weight="400" fill="#666" text-anchor="start">appunti all'istante, senza che tu faccia altro</text>
