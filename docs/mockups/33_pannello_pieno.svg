<text x="22" y="576" font-family="Segoe UI" font-size="9.5" font-weight="400" fill="#6B6B75" text-anchor="start">36 caratteri</text>
<rect x="16" y="596" width="334" height="52" rx="14" fill="#1B1B1F" />
