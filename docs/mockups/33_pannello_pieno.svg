<rect x="370" y="132" width="4" height="220" rx="2" fill="#242429" />
<text x="16" y="684" font-family="Segoe UI" font-size="9.5" font-weight="400" fill="#6B6B75" text-anchor="start">12 di ~40 voci visibili</text>
