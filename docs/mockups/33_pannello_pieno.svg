<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 700" width="380" height="700" role="img" aria-label="Pannello pieno - molte righe">
<title>pastepad con 12 voci visibili, barra di scorrimento</title>
<desc>Il pannello allungato a dimensione grande con dodici righe visibili di fila e la barra di scorrimento a destra, a mostrare che si può continuare a scendere.</desc>

<rect x="0" y="0" width="380" height="700" rx="20" fill="#0B0B0D" stroke="#242429" stroke-width="1"/>
