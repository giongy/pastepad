<rect x="153" y="199" width="210" height="210" rx="12" fill="#000000" opacity="0.35"/>
<rect x="150" y="194" width="210" height="210" rx="12" fill="#141417" stroke="#242429" stroke-width="1"/>
<text x="168" y="220" font-family="Segoe UI" font-size="11" font-weight="400" fill="#F4F4F5" text-anchor="start">Incolla</text>
<text x="168" y="247" font-family="Segoe UI" font-size="11" font-weight="400" fill="#F4F4F5" text-anchor="start">Incolla senza formato</text>
<text x="168" y="274" font-family="Segoe UI" font-size="11" font-weight="400" fill="#F4F4F5" text-anchor="start">Copia</text>
