<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 480" width="380" height="480" role="img" aria-label="Menu dei tre punti aperto">
<title>pastepad menu di riga</title>
<desc>Il menu contestuale di una voce della cronologia: Incolla, Incolla senza formato, Copia, Fissa in alto, Modifica e salva, Elimina.</desc>

<rect x="0" y="0" width="380" height="480" rx="20" fill="#0B0B0D" stroke="#242429" stroke-width="1"/>
<text x="16" y="26" font-family="Segoe UI" font-size="11" font-weight="400" fill="#6B6B75" text-anchor="start">Ctrl + Shift + V</text>
<circle cx="300" cy="20" r="10" fill="#1B1B1F" />
<text x="300" y="24" font-family="Segoe UI" font-size="9" font-weight="400" fill="#9C9CA6" text-anchor="middle">II</text>
<circle cx="330" cy="20" r="10" fill="#1B1B1F" />
<text x="330" y="24" font-family="Segoe UI" font-size="9" font-weight="400" fill="#9C9CA6" text-anchor="middle">@</text>
<circle cx="360" cy="20" r="10" fill="#1B1B1F" />
<text x="360" y="24" font-family="Segoe UI" font-size="9" font-weight="400" fill="#9C9CA6" text-anchor="middle">x</text>
<rect x="16" y="38" width="348" height="42" rx="12" fill="#141417" />
<text x="32" y="64" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6B6B75" text-anchor="start">◎  Cerca ovunque</text>
<rect x="16" y="90" width="172" height="30" rx="15" fill="#2DD4A7" />
