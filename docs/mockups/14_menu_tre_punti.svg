<text x="278" y="109" font-family="Segoe UI" font-size="12" font-weight="400" fill="#9C9CA6" text-anchor="middle">Salvati</text>
<rect x="16" y="132" width="348" height="56" rx="14" fill="#26262B" />
<text x="22" y="154" font-family="Segoe UI" font-size="12.5" font-weight="400" fill="#F4F4F5" text-anchor="start">Rapporto mensile di fatturazione</text>
<text x="22" y="172" font-family="Segoe UI" font-size="10" font-weight="400" fill="#6B6B75" text-anchor="start">29 caratteri</text>
