<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320" role="img" aria-label="Windows Defender - dopo Ulteriori informazioni">
<title>schermata blu con Esegui comunque visibile</title>
<desc>Lo stesso avviso, un passo dopo: facendo clic su Ulteriori informazioni compare il pulsante Esegui comunque.</desc>

<rect width="460" height="320" fill="#0B57C4" rx="8"/>
<rect x="0" y="0" width="460" height="70" fill="#0A4DA8"/>
<text x="30" y="42" font-family="Segoe UI" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">🛡  PC protetto da Windows</text>
<text x="30" y="90" font-family="Segoe UI" font-size="12" font-weight="400" fill="#DCE7FA" text-anchor="start">Microsoft Defender SmartScreen ha impedito</text>
<text x="30" y="108" font-family="Segoe UI" font-size="12" font-weight="400" fill="#DCE7FA" text-anchor="start">l'avvio di un'app non riconosciuta.</text>
<rect x="30" y="140" width="400" height="80" rx="4" fill="#0A4DA8" />
<text x="46" y="164" font-family="Segoe UI" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="start">Applicazione: pastepad.exe</text>
<text x="46" y="182" font-family="Segoe UI" font-size="11" font-weight="400" fill="#DCE7FA" text-anchor="start">Autore: Autore sconosciuto</text>
<text x="46" y="200" font-family="Segoe UI" font-size="11" font-weight="400" fill="#DCE7FA" text-anchor="start">Data: oggi</text>
<rect x="30" y="244" width="220" height="38" rx="3" fill="#2E8B3D" />
<text x="140" y="268" font-family="Segoe UI" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">Esegui comunque</text>
<rect x="260" y="244" width="150" height="38" rx="3" fill="#FFFFFF" />
<text x="335" y="268" font-family="Segoe UI" font-size="12" font-weight="500" fill="#0B57C4" text-anchor="middle">Non eseguire</text>
</svg>