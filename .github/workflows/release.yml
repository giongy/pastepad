name: Build and release

# Compila l'installer su un runner pulito di GitHub e lo pubblica.
# Vantaggio rispetto a compilare sulla propria macchina: chiunque può
# vedere il registro della compilazione e verificare che il binario
# esce dal codice pubblicato.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # La versione esce dal tag, non scritta a mano in dodici posti: fu
      # pubblicata una release con binari vecchi proprio per questo. Il
      # .csproj NON ha <Version>, la mette qui -p:Version=.
      - name: Ricavare la versione
        id: v
        shell: pwsh
        run: |
          $t = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $t -or $t -eq "main") { $t = "0.0.0-dev" }
          "version=$t" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "versione: $t"

      - name: Prove del nucleo
        run: dotnet test csharp/Pastepad.Nucleo.Prove -c Release

      # publish e non build: build lascia una cartella che non si avvia
      # da sola. A 64 bit, come la build che si prova in sviluppo: così
      # ciò che si distribuisce è lo stesso binario che si è provato. Il
      # costo è il peso: a 64 bit il Windows App SDK copia anche
      # onnxruntime.dll (21 MB) e DirectML.dll (18 MB), due librerie di
      # IA che pastepad non usa, e la cartella passa da 201 a 268 MB.
      # dotnet publish non svuota la cartella di destinazione: ciò che
      # resta da prima viaggia dentro l'installer. Su un runner pulito
      # non può succedere, ma su una macchina di sviluppo sì — qui si
      # infilò un errori.log di una prova precedente.
      - name: Svuotare la cartella di publish
        shell: pwsh
        run: |
          if (Test-Path pubblicato-x64) {
            Remove-Item pubblicato-x64 -Recurse -Force
          }

      - name: Pubblicare x64
        run: >
          dotnet publish csharp/Pastepad.App
          -c Release -p:Platform=x64 -r win-x64
          -p:Version=${{ steps.v.outputs.version }}
          -o pubblicato-x64

      - name: Controllare ciò che è pubblicato
        shell: pwsh
        run: |
          $exe = "pubblicato-x64\pastepad.exe"
          if (-not (Test-Path $exe)) { throw "pastepad.exe non è stato generato" }

          $n = (Get-ChildItem pubblicato-x64 -Recurse -File).Count
          $mb = [math]::Round(((Get-ChildItem pubblicato-x64 -Recurse -File |
                 Measure-Object Length -Sum).Sum / 1MB), 1)
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "file: $n   dimensione: $mb MB"
          Write-Host "versione: $($vi.ProductVersion)   azienda: $($vi.CompanyName)"

          # Che la versione del tag arrivi davvero all'eseguibile: è
          # l'errore che si è già infilato una volta.
          if ($vi.ProductVersion -ne "${{ steps.v.outputs.version }}") {
            throw "l'.exe dice '$($vi.ProductVersion)' e il tag è '${{ steps.v.outputs.version }}'"
          }

      # Inno Setup era preinstallato nell'immagine windows-2022, ma NON
      # lo è in windows-2025, che è quella che oggi risponde a
      # windows-latest. Si installa invece di fissare l'immagine
      # vecchia, che tra l'altro è annunciata per il ritiro.
      - name: Installare Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Costruire l'installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "non trovo ISCC in $iscc" }

          # Tra virgolette: il percorso del runner oggi non ha spazi,
          # ma quello di una macchina qualsiasi sì.
          & $iscc "/DVersion=${{ steps.v.outputs.version }}" `
                  "/DPublish=$(Join-Path $PWD 'pubblicato-x64')" `
                  "installer\pastepad.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC è fallito con $LASTEXITCODE" }

      # Il nome dell'asset è un contratto, non un caso: è quello che
      # citano le note di release e le istruzioni di verifica. Se
      # qualcuno lo cambia —nell'.iss o qui— conviene che esploda la
      # pubblicazione piuttosto che uscire una release con istruzioni
      # che non corrispondono al file.
      - name: Controllare il nome dell'asset
        shell: pwsh
        run: |
          $atteso = "pastepad-${{ steps.v.outputs.version }}-installer.exe"
          $presenti = @(Get-ChildItem dist -Filter *.exe | Select-Object -ExpandProperty Name)

          Write-Host "atteso  : $atteso"
          Write-Host "presenti: $($presenti -join ', ')"

          if ($presenti -notcontains $atteso) {
            throw "l'installer non si chiama '$atteso'."
          }

          if ($presenti.Count -ne 1) {
            throw "ci sono $($presenti.Count) eseguibili in dist; deve essercene uno"
          }

      - name: Hash
        shell: pwsh
        run: |
          $f = "pastepad-${{ steps.v.outputs.version }}-installer.exe"
          if (-not (Test-Path "dist\$f")) { throw "$f non è stato generato" }

          $mb = [math]::Round((Get-Item "dist\$f").Length / 1MB, 1)
          Write-Host "installer: $mb MB"

          $h = (Get-FileHash "dist\$f" -Algorithm SHA256).Hash
          "$h  $f" | Out-File -Encoding ascii dist\SHA256.txt
          Write-Host "$f  ->  $h"

      - uses: actions/upload-artifact@v4
        with:
          name: pastepad
          path: |
            dist/pastepad-${{ steps.v.outputs.version }}-installer.exe
            dist/SHA256.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pastepad-${{ steps.v.outputs.version }}-installer.exe
            dist/SHA256.txt
          body: |
            ## Se hai già pastepad

            pastepad controlla una volta al giorno se c'è qualcosa di
            nuovo e te lo dice dentro il pannello. Si può spegnere in
            Aspetto.

            Installare sopra sostituisce ciò che c'è. La tua cronologia
            e i tuoi testi salvati non si toccano: vivono in un'altra
            cartella.

            ## Installazione

            **`pastepad-${{ steps.v.outputs.version }}-installer.exe`**

            Eseguilo e basta. **Non chiede l'amministratore.** Si
            installa solo per il tuo utente, in
            `%LOCALAPPDATA%\Programs\pastepad`.

            Scorciatoia per aprire il pannello: **Ctrl + Shift + V**

            ## I tuoi dati non si toccano disinstallando

            Il programma si installa in una cartella e i tuoi dati
            vivono in un'altra, `%LOCALAPPDATA%\pastepad`. Disinstallare
            si porta via il programma e **non può toccare la tua
            cronologia né i tuoi testi salvati**, perché non stanno più
            nello stesso posto.

            Se vuoi eliminare anche quelli, cancella quella cartella a
            mano.

            ## Windows Defender

            La prima volta comparirà "PC protetto da Windows". Ulteriori
            informazioni -> Esegui comunque.

            Non è che il file abbia qualcosa di strano: SmartScreen
            avvisa per qualsiasi eseguibile non firmato finché non
            accumula download. Si compila su un runner pulito di GitHub
            Actions a partire da questo codice, e il registro è pubblico.

            ## Verificare il download

            ```powershell
            Get-FileHash pastepad-${{ steps.v.outputs.version }}-installer.exe -Algorithm SHA256
            ```
